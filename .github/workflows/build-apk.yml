name: Build Flow AI Keyboard APK & Play Store Bundle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Official Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Keystore for Google Play Release
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias flowkey -keyalg RSA -keysize 2048 -validity 10000 -storepass flowpassword -keypass flowpassword -dname "CN=FlowAI, OU=Keyboard, O=Flow, L=City, S=State, C=IN"

      - name: Build APK & Google Play Bundle (.aab) with Gradle
        run: gradle assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload Phone Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Flow-AI-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Google-PlayStore-Bundle-AAB
          path: app/build/outputs/bundle/release/app-release.aab
